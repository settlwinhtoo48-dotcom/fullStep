<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>အကောင့်ဖွင့်ရန်</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
        }
        button {
            padding: 10px 15px;
            background-color: #0070f3;
            color: white;
            border: none;
            cursor: pointer;
        }
        #message {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>အကောင့်အသစ်ဖွင့်ရန်</h2>
    
    <form id="registerForm">
        <div class="form-group">
            <label>နာမည်:</label>
            <input type="text" id="name" required>
        </div>
        <div class="form-group">
            <label>အီးမေးလ်:</label>
            <input type="email" id="email" required>
        </div>
        <div class="form-group">
            <label>စကားဝှက်:</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit">အကောင့်လုပ်ရန်</button>
    </form>

    <div id="message"></div>

    <script>
        const form = document.getElementById('registerForm');
        const messageDiv = document.getElementById('message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                // localhost ဖြုတ်ပြီး Relative path (/register) ကိုသာ အသုံးပြုထားပါသည်
                const response = await fetch('/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, email, password })
                });

                const data = await response.json();

                if (response.ok) {
                    messageDiv.style.color = 'green';
                    messageDiv.textContent = 'အကောင့်ဖွင့်ခြင်း အောင်မြင်ပါသည်။';
                    form.reset();
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.textContent = data.error || 'အမှားအယွင်း ရှိနေပါသည်။';
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.textContent = 'ဆာဗာသို့ ချိတ်ဆက်၍ မရပါ။';
            }
        });
    </script>

</body>
</html>
